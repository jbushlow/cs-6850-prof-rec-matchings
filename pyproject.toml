[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faculty-network-pipeline"
version = "0.1.0"
description = "Faculty directory and OpenAlex coauthorship/abstract ETL"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "PyYAML>=6.0", "networkx>=3.2", "playwright>=1.49", "tqdm>=4.66"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
facultygraph = "facultygraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["facultygraph*"]
